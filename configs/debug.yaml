# TemporalVectors -- Debug Configuration
# Small-scale settings for fast iteration and testing.

# ── Model ────────────────────────────────────────────────────────
model_name: "meta-llama/Llama-3.2-3B"
device_map: "auto"
torch_dtype: "bfloat16"

# ── Target layers (single layer for speed) ───────────────────────
target_layers: [14]

# ── Dataset (small counts) ───────────────────────────────────────
min_natural_pairs: 20
min_synthetic_pairs: 20
min_control_pairs: 10
max_pairs: 20

# ── Wikipedia fetching ───────────────────────────────────────────
wiki_rate_limit_seconds: 1.0
wiki_target_years: [2022, 2023]
wiki_domains:
  - politics
  - technology

# ── Hidden state extraction ──────────────────────────────────────
extraction_batch_size: 4
max_seq_length: 256
pooling: "last_token"

# ── Temporal vector estimation ───────────────────────────────────
direction_method: "mean"

# ── Causal inner product ─────────────────────────────────────────
cip_regularisation: 1.0e-4

# ── Forecasting ──────────────────────────────────────────────────
forecast_alpha_range: [0.5, 1.0, 1.5]
test_split_ratio: 0.2

# ── Statistical tests (fewer iterations for speed) ───────────────
n_bootstrap: 1000
confidence_level: 0.95
n_permutations: 1000

# ── Reproducibility ──────────────────────────────────────────────
seed: 42
