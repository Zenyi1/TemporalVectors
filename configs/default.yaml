# TemporalVectors -- Default Configuration
# Production settings for full experiment runs.

# ── Model ────────────────────────────────────────────────────────
model_name: "meta-llama/Llama-3.2-3B"
device_map: "auto"
torch_dtype: "bfloat16"

# ── Target layers ────────────────────────────────────────────────
target_layers: [7, 14, 21, 27]

# ── Dataset ──────────────────────────────────────────────────────
min_natural_pairs: 500
min_synthetic_pairs: 300
min_control_pairs: 200

# ── Wikipedia fetching ───────────────────────────────────────────
wiki_rate_limit_seconds: 1.0
wiki_target_years: [2020, 2021, 2022, 2023, 2024]
wiki_domains:
  - politics
  - technology
  - science
  - sports
  - geography
  - economics

# ── Hidden state extraction ──────────────────────────────────────
extraction_batch_size: 8
max_seq_length: 512
pooling: "last_token"

# ── Temporal vector estimation ───────────────────────────────────
direction_method: "mean"  # "mean" or "pca"

# ── Causal inner product ─────────────────────────────────────────
cip_regularisation: 1.0e-4

# ── Forecasting ──────────────────────────────────────────────────
forecast_alpha_range: [0.5, 1.0, 1.5, 2.0]
test_split_ratio: 0.2

# ── Statistical tests ────────────────────────────────────────────
n_bootstrap: 10000
confidence_level: 0.95
n_permutations: 10000

# ── Reproducibility ──────────────────────────────────────────────
seed: 42
